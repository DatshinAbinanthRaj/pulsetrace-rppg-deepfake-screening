[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsetrace"
version = "0.1.0"
description = "Deepfake screening from facial blood-flow signals (remote photoplethysmography)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8,<5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=7", "ruff>=0.4", "bandit>=1.7"]

[project.scripts]
pulsetrace = "pulsetrace.cli:main"

[tool.setuptools]
packages = ["pulsetrace"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
